<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Central do Viajante da Rota Livre - aplicação em AngularJS">
  <title>Central do Viajante | Rota Livre</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">

  <!-- Estilos gerais -->
  <link rel="stylesheet" href="app/app.css">

  <!-- Estilos dos componentes -->
  <link rel="stylesheet" href="app/componentes/acordeao/acordeao.css">
  <link rel="stylesheet" href="app/componentes/paginacao/paginacao.css">
  <link rel="stylesheet" href="app/componentes/barra-progresso/barra-progresso.css">
  <link rel="stylesheet" href="app/componentes/abas/abas.css">
  <link rel="stylesheet" href="app/componentes/menu-suspenso/menu-suspenso.css">
  <link rel="stylesheet" href="app/componentes/toast/toast.css">

  <!-- Estilos das seções -->
  <link rel="stylesheet" href="app/secoes/menu-lateral/menu-lateral.css">
  <link rel="stylesheet" href="app/secoes/topo/topo.css">
  <link rel="stylesheet" href="app/secoes/destaque/destaque.css">
  <link rel="stylesheet" href="app/secoes/explorar/explorar.css">
  <link rel="stylesheet" href="app/secoes/minha-viagem/minha-viagem.css">
  <link rel="stylesheet" href="app/secoes/ajuda/ajuda.css">
</head>

<!-- ng-app inicia o módulo principal; a página é montada com as seções (diretivas) -->
<body ng-app="rotaLivre" ng-controller="AppController" ng-cloak>

  <a href="#conteudo" class="pular-link">{{t.ui.pularConteudo}}</a>

  <div class="app">
    <menu-lateral></menu-lateral>

    <main id="conteudo" class="principal">
      <topo></topo>
      <destaque></destaque>
      <explorar></explorar>
      <minha-viagem></minha-viagem>
      <ajuda></ajuda>

      <footer class="rodape">
        <p>{{t.ui.rodape}}</p>
      </footer>
    </main>
  </div>

  <!-- Notificações (as mensagens vêm do ToastService) -->
  <toast-container titulos="t.ui.toast.titulos" rotulo-fechar="t.ui.toast.fechar"></toast-container>


  <!-- ========== SCRIPTS ========== -->

  <!-- AngularJS (baixado na pasta vendor/) -->
  <script src="vendor/angular.min.js"></script>

  <!-- Módulos (precisa vir antes de tudo) -->
  <script src="app/app.module.js"></script>

  <!-- Compartilhado: textos, dados, serviços e filtros -->
  <script src="app/compartilhado/traducao/idiomas/pt.js"></script>
  <script src="app/compartilhado/traducao/idiomas/en.js"></script>
  <script src="app/compartilhado/traducao/idiomas/es.js"></script>
  <script src="app/compartilhado/traducao/traducao.service.js"></script>
  <script src="app/compartilhado/destinos/destinos.data.js"></script>
  <script src="app/compartilhado/destinos/destinos.service.js"></script>
  <script src="app/compartilhado/filtros/filtros.js"></script>

  <!-- Componentes (os 6 pedidos na atividade) -->
  <script src="app/componentes/acordeao/acordeao.directive.js"></script>
  <script src="app/componentes/paginacao/paginacao.directive.js"></script>
  <script src="app/componentes/barra-progresso/barra-progresso.directive.js"></script>
  <script src="app/componentes/abas/abas.directive.js"></script>
  <script src="app/componentes/menu-suspenso/menu-suspenso.directive.js"></script>
  <script src="app/componentes/toast/toast.service.js"></script>
  <script src="app/componentes/toast/toast.directive.js"></script>

  <!-- Seções da página -->
  <script src="app/secoes/menu-lateral/menu-lateral.directive.js"></script>
  <script src="app/secoes/topo/topo.directive.js"></script>
  <script src="app/secoes/destaque/destaque.directive.js"></script>
  <script src="app/secoes/explorar/explorar.directive.js"></script>
  <script src="app/secoes/minha-viagem/minha-viagem.data.js"></script>
  <script src="app/secoes/minha-viagem/minha-viagem.directive.js"></script>
  <script src="app/secoes/ajuda/ajuda.directive.js"></script>

  <!-- Controlador da página -->
  <script src="app/app.controller.js"></script>
</body>
</html>
